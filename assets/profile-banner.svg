<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Bùi Ngọc Yên — Frontend Engineer</title>
  <desc id="description">A dark, carefully gridded profile banner with the name Bùi Ngọc Yên and a small illustration of an interactive design system.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A111D"/>
      <stop offset="0.58" stop-color="#0E1A2B"/>
      <stop offset="1" stop-color="#10243A"/>
    </linearGradient>
    <radialGradient id="ambient" cx="83%" cy="56%" r="70%">
      <stop offset="0" stop-color="#2B6A77" stop-opacity=".28"/>
      <stop offset=".65" stop-color="#1C3952" stop-opacity=".07"/>
      <stop offset="1" stop-color="#1C3952" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8FF73"/>
      <stop offset="1" stop-color="#79E5CE"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 H 0 V 40" fill="none" stroke="#A6C4D6" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="20" fill="url(#background)"/>
  <rect width="1200" height="360" rx="20" fill="url(#ambient)"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1199" height="359" rx="19.5" fill="none" stroke="#7997AB" stroke-opacity=".18"/>

  <!-- Typographic introduction -->
  <rect x="68" y="62" width="16" height="16" rx="4" fill="url(#accent)"/>
  <path d="M73 70h6M76 67v6" stroke="#12242D" stroke-width="1.5" stroke-linecap="round"/>
  <text x="98" y="76" fill="#AFC4D0" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="3.1">FRONTEND ENGINEERING</text>

  <text x="66" y="172" fill="#F5F8F1" font-family="Segoe UI, Arial, sans-serif" font-size="70" font-weight="700" letter-spacing="-3">Bùi Ngọc Yên</text>
  <text x="69" y="225" fill="#BFE6DB" font-family="Segoe UI, Arial, sans-serif" font-size="35" font-weight="400" letter-spacing="-.5">Frontend Engineer</text>

  <rect x="68" y="258" width="520" height="1" fill="#7B9BAA" fill-opacity=".35"/>
  <text x="69" y="294" fill="#AFC4D0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="2.3">COMPONENTS  /  INTERACTION  /  ACCESSIBILITY</text>

  <!-- Interface study: frames, tokens, states, and interactive controls -->
  <rect x="730" y="47" width="412" height="266" rx="20" fill="#07111D" fill-opacity=".35" stroke="#88A6B8" stroke-opacity=".28"/>
  <rect x="738" y="55" width="396" height="250" rx="15" fill="#152638" stroke="#567C8B" stroke-opacity=".35"/>
  <path d="M739 98.5h394" stroke="#7D9CAB" stroke-opacity=".27"/>
  <circle cx="763" cy="77" r="4" fill="#75E2CD"/>
  <circle cx="780" cy="77" r="4" fill="#678397"/>
  <circle cx="797" cy="77" r="4" fill="#678397"/>
  <text x="828" y="83" fill="#B6CBD1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2">INTERFACE SYSTEM</text>
  <text x="1083" y="83" fill="#7494A1" font-family="Consolas, monospace" font-size="12">01</text>

  <rect x="760" y="115" width="236" height="98" rx="11" fill="#0F1B2B" stroke="#63879A" stroke-opacity=".5"/>
  <text x="775" y="138" fill="#9FB8C4" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.3">BUTTON / STATES</text>
  <rect x="775" y="154" width="94" height="37" rx="8" fill="url(#accent)"/>
  <text x="791" y="178" fill="#10232A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Explore</text>
  <path d="M848 172h8m-3-3 3 3-3 3" fill="none" stroke="#10232A" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
  <rect x="878" y="154" width="103" height="37" rx="8" fill="#192E40" stroke="#89A8B2" stroke-opacity=".65"/>
  <text x="895" y="178" fill="#C7DCE0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">Secondary</text>

  <rect x="1008" y="115" width="105" height="98" rx="11" fill="#0F1B2B" stroke="#63879A" stroke-opacity=".5"/>
  <text x="1024" y="138" fill="#9FB8C4" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.3">TYPE</text>
  <text x="1023" y="183" fill="#E7F2EB" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="-3">Aa</text>
  <path d="M1025 195h71" stroke="#78A9B3" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>

  <rect x="760" y="225" width="353" height="59" rx="11" fill="#0F1B2B" stroke="#63879A" stroke-opacity=".5"/>
  <text x="775" y="246" fill="#9FB8C4" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.3">DESIGN TOKENS</text>
  <rect x="775" y="257" width="67" height="11" rx="5.5" fill="#C8FF73"/>
  <rect x="848" y="257" width="67" height="11" rx="5.5" fill="#79E5CE"/>
  <rect x="921" y="257" width="67" height="11" rx="5.5" fill="#6FAAC2"/>
  <rect x="994" y="257" width="34" height="11" rx="5.5" fill="#304B60"/>
  <rect x="1034" y="257" width="20" height="11" rx="5.5" fill="#20384C"/>
  <rect x="1060" y="257" width="38" height="11" rx="5.5" fill="#E7F2EB"/>
</svg>
